name: RDTE Context Probe — Windows PowerShell 5.1
on:
  pull_request:
    paths:
      - 'automation/windows/Scrutari-Netlify-RDTE-Context-Probe.ps1'
      - 'docs/RDTE-CONTEXT-PROBE.md'
      - '.github/workflows/rdte-context-probe.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    runs-on: windows-2022
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Parse under Windows PowerShell 5.1 and run read-only Plan
        shell: powershell
        run: |
          $p = Join-Path $env:GITHUB_WORKSPACE 'automation\windows\Scrutari-Netlify-RDTE-Context-Probe.ps1'
          $tokens = $null; $errors = $null
          [Management.Automation.Language.Parser]::ParseFile($p,[ref]$tokens,[ref]$errors)|Out-Null
          if ($errors.Count -gt 0) { throw 'PS5.1 parse failed' }
          $plan = (& $p -Mode Plan | Out-String)
          if ($plan -notmatch 'PLAN_ONLY' -or $plan -notmatch 'scrutari-rdte-sempersupra') { throw 'Plan gate failed' }
          Write-Host 'RDTE_CONTEXT_PROBE_PLAN_GREEN'
      - name: Exercise draft arguments and permissions with a local fake toolbox
        shell: powershell
        run: |
          $p = Join-Path $env:GITHUB_WORKSPACE 'automation\windows\Scrutari-Netlify-RDTE-Context-Probe.ps1'
          $fake = Join-Path $env:RUNNER_TEMP 'fake-netlify-toolbox.ps1'
          $record = Join-Path $env:RUNNER_TEMP 'rdte-args.json'
          $env:SCRUTARI_PROBE_RECORD = $record
          @'
          [CmdletBinding()]
          param([string]$Mode,[switch]$AllowMutatingCommands,[string[]]$CliArgs)
          if ($Mode -ne 'Run' -or -not $AllowMutatingCommands) { throw 'Unexpected wrapper mode' }
          if ($CliArgs[0] -ne 'deploy') { throw 'Unexpected CLI command' }
          if ($CliArgs -contains '--prod' -or $CliArgs -contains '--context') { throw 'Unsafe or incompatible deploy flags' }
          if ($CliArgs -notcontains '--no-build' -or $CliArgs -notcontains '--site') { throw 'Missing gated draft flags' }
          $i = [Array]::IndexOf($CliArgs,'--site')
          if (($i + 1) -ge $CliArgs.Length -or $CliArgs[$i+1] -ne 'c7bb4aae-c13d-431b-bc93-4e79a85e1f37') {
            throw 'Unexpected project ID'
          }
          $function = Join-Path (Get-Location).Path 'netlify\functions\rdte-context.mjs'
          $page = Join-Path (Get-Location).Path 'public\index.html'
          if (-not (Test-Path -LiteralPath $function) -or -not (Test-Path -LiteralPath $page)) {
            throw 'Draft fixture assets missing'
          }
          if ((Get-Content -LiteralPath $function -Raw) -notmatch 'writesPerformed:false') {
            throw 'Draft fixture must be read-only'
          }
          if ($env:SCRUTARI_PROBE_MOCK_FAIL -eq 'yes') { throw 'Simulated CLI failure' }
          $CliArgs | ConvertTo-Json | Set-Content -LiteralPath $env:SCRUTARI_PROBE_RECORD
          Write-Output 'MOCK_DRAFT_ONLY_NOT_A_NETLIFY_DEPLOY'
          '@ | Set-Content -LiteralPath $fake
          $noApprovalDenied = $false
          try { & $p -Mode Deploy -Toolbox $fake } catch { $noApprovalDenied = $true }
          if (-not $noApprovalDenied -or (Test-Path -LiteralPath $record)) {
            throw 'Draft ran without explicit approval'
          }
          & $p -Mode Deploy -ApproveDraftDeployment -Toolbox $fake
          if (-not (Test-Path -LiteralPath $record)) { throw 'Approved offline mock was not invoked' }
          # Inspect the exact mock-recorded JSON text, not PowerShell's
          # automatic $args variable (which is reserved for unbound parameters).
          $capturedJson = [System.IO.File]::ReadAllText($record)
          if ($capturedJson -match '"--context"' -or
              $capturedJson -match '"--prod"' -or
              $capturedJson -notmatch '"--no-build"' -or
              $capturedJson -notmatch '"--site"' -or
              $capturedJson -notmatch 'c7bb4aae-c13d-431b-bc93-4e79a85e1f37') {
            throw 'Rejected Netlify CLI flag combination'
          }
          Remove-Item -LiteralPath $record -Force
          $env:SCRUTARI_PROBE_MOCK_FAIL = 'yes'
          $failedClosed = $false
          try { & $p -Mode Deploy -ApproveDraftDeployment -Toolbox $fake } catch { $failedClosed = $true }
          if (-not $failedClosed -or (Test-Path -LiteralPath $record)) {
            throw 'Failed CLI incorrectly acknowledged a draft deployment'
          }
          Write-Host 'RDTE_DRAFT_PROBE_MOCK_GREEN'

